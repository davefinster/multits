# Keeps the pins in .github/workflows from going stale.
#
# The workflow's actions are pinned to a commit rather than a tag, so nothing
# about them floats. Dependabot rewrites the commit and the `# vX.Y.Z`
# comment beside it together, which is why that comment is there. All bumps
# arrive grouped in one pull request, which image.yml builds without pushing.
#
# The Dockerfile's images are tracked too: golang:1.27-alpine floats on
# patch releases by itself, and Dependabot proposes the next minor.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
